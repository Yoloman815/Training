<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lernen</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lernen">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  /* Layout: iPhone-App in einer Spalte (max. 500 px) – große Titel, gruppierte Listen, Tab-Leiste unten; Lernsession als Vollbild mit Stufenleiste */
  --bg:#F2F2F7;
  --card:#FFFFFF;
  --fill:rgba(118,118,128,.12);
  --fill-2:rgba(118,118,128,.22);
  --label:#000000;
  --label-2:rgba(60,60,67,.6);
  --label-3:rgba(60,60,67,.3);
  --sep:rgba(60,60,67,.29);
  --tint:#5856D6;
  --tint-soft:rgba(88,86,214,.12);
  --green:#34C759; --green-soft:rgba(52,199,89,.15);
  --orange:#FF9500; --orange-soft:rgba(255,149,0,.15);
  --red:#FF3B30; --red-soft:rgba(255,59,48,.12);
  --bar:rgba(249,249,249,.86);
  --seg-on:#FFFFFF;
  --seg-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);
  --scrim:rgba(0,0,0,.35);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --font-round:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Arial,sans-serif;
  --tabbar-h:calc(56px + env(safe-area-inset-bottom));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#1C1C1E; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
    --label:#FFFFFF; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
    --tint:#7D7AFF; --tint-soft:rgba(125,122,255,.2);
    --green:#30D158; --green-soft:rgba(48,209,88,.18); --orange:#FF9F0A; --orange-soft:rgba(255,159,10,.18); --red:#FF453A; --red-soft:rgba(255,69,58,.18);
    --bar:rgba(22,22,24,.86); --seg-on:#636366; --seg-shadow:none; --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fill:rgba(118,118,128,.24); --fill-2:rgba(118,118,128,.36);
  --label:#FFFFFF; --label-2:rgba(235,235,245,.6); --label-3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65);
  --tint:#7D7AFF; --tint-soft:rgba(125,122,255,.2);
  --green:#30D158; --green-soft:rgba(48,209,88,.18); --orange:#FF9F0A; --orange-soft:rgba(255,159,10,.18); --red:#FF453A; --red-soft:rgba(255,69,58,.18);
  --bar:rgba(22,22,24,.86); --seg-on:#636366; --seg-shadow:none; --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--label);font-family:var(--font);font-size:17px;line-height:1.35;letter-spacing:-.2px;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
p{margin:0}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.center{text-align:center}
.app{position:fixed;top:0;right:0;bottom:0;left:0;max-width:500px;margin:0 auto;background:var(--bg);overflow:hidden}
@media (min-width:520px){.app{border-left:.5px solid var(--sep);border-right:.5px solid var(--sep)}}
main{position:absolute;inset:0;overflow-y:auto;overscroll-behavior:contain;padding-bottom:calc(var(--tabbar-h) + 20px)}
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:20;height:var(--tabbar-h);display:grid;grid-template-columns:repeat(3,1fr);padding:7px 4px env(safe-area-inset-bottom);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:0;color:var(--label-2);font-size:10px;font-weight:500;letter-spacing:.1px;position:relative}
.tab svg{width:27px;height:27px}
.tab[aria-current="page"]{color:var(--tint)}
.tab .tbadge{position:absolute;top:-2px;left:calc(50% + 7px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;font-size:12px;font-weight:600;line-height:18px;text-align:center}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.navbar{position:sticky;top:0;z-index:10;height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px;border-bottom:.5px solid transparent;transition:background-color .2s,border-color .2s}
.navbar .nav-title{font-size:17px;font-weight:600;opacity:0;transition:opacity .2s;max-width:56vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navbar.scrolled{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom-color:var(--sep)}
.navbar.scrolled .nav-title{opacity:1}
.nav-btn{border:0;background:none;color:var(--tint);font-size:17px;padding:10px 0;justify-self:start;display:inline-flex;align-items:center;gap:2px}
.nav-btn.strong{font-weight:600}
.nav-btn.end{justify-self:end}
.nav-btn svg{width:22px;height:22px}
.navbar{margin-bottom:calc(-44px - env(safe-area-inset-top));pointer-events:none}
.navbar.scrolled,.navbar .nav-btn{pointer-events:auto}
.navbar.has-left{margin-bottom:0}
.navbar.has-left + .lt{padding-top:0}
.lt{padding:calc(env(safe-area-inset-top) + 10px) 16px 6px}
.lt-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.lt h1{margin:0;font-size:34px;line-height:41px;font-weight:700;letter-spacing:.2px;overflow-wrap:anywhere}
.lt-date{font-size:13px;font-weight:600;text-transform:uppercase;color:var(--label-2);margin-bottom:-2px}
.lt-sub{margin-top:2px;font-size:15px;color:var(--label-2)}
.avatar-btn{flex:none;width:36px;height:36px;border-radius:50%;border:0;background:linear-gradient(180deg,#A5A5AE,#7D7D86);color:#fff;font-weight:600;font-size:15px;margin-bottom:4px;display:grid;place-items:center}
.content{padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.sec-title{margin:12px 4px -4px;font-size:22px;line-height:28px;font-weight:700;letter-spacing:.35px}
.card{background:var(--card);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.group{background:var(--card);border-radius:12px;overflow:hidden}
.group > *{position:relative}
.group > * + *::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep);pointer-events:none}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit;letter-spacing:inherit}
button.row:active{background:var(--fill)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row-title{font-size:17px;overflow-wrap:anywhere}
.row-sub{font-size:15px;color:var(--label-2)}
.row-val{font-size:17px;color:var(--label-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.chev{flex:none;width:8px;height:14px;color:var(--label-3)}
.row.add{color:var(--tint);gap:8px}
.row.add svg{width:20px;height:20px;flex:none}
.row.destructive{color:var(--red);justify-content:center}
.row.tint{color:var(--tint);justify-content:center}
.num-dot{flex:none;width:28px;height:28px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-family:var(--font-round);font-weight:600;font-size:14px;color:var(--label-2)}
.num-dot.ok{background:var(--green);color:#fff}
.num-dot.warn{background:var(--orange);color:#fff}
.num-dot.go{background:var(--tint);color:#fff}
.num-dot svg{width:15px;height:15px;stroke-width:3}
.cap{font-size:13px;font-weight:600;text-transform:uppercase;color:var(--label-2)}
.cap.pad{padding:18px 16px 7px}
.title2{font-size:22px;line-height:28px;font-weight:700;letter-spacing:.35px;margin:0}
.title3{font-size:20px;line-height:25px;font-weight:600;letter-spacing:.38px;margin:0}
.headline{font-size:17px;font-weight:600}
.sub{font-size:15px;color:var(--label-2);line-height:1.38}
.foot{font-size:13px;color:var(--label-2);padding:7px 16px 0;line-height:1.4}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:14px;min-height:50px;padding:0 18px;font-family:var(--font);font-size:17px;font-weight:600;width:100%;text-align:center}
.btn.filled{background:var(--tint);color:#fff}
.btn.tinted{background:var(--tint-soft);color:var(--tint)}
.btn.green{background:var(--green);color:#fff}
.btn.plain{background:var(--fill);color:var(--label)}
.btn.small{min-height:38px;border-radius:10px;font-size:15px;width:auto;align-self:flex-start;padding:0 16px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn:active:not(:disabled){opacity:.7}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{border:0;background:none;color:var(--tint);font-size:15px;font-weight:500;padding:2px 0;align-self:flex-start}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--fill);color:var(--label-2);white-space:nowrap;letter-spacing:0}
.badge.green{background:var(--green-soft);color:var(--green)}
.badge.orange{background:var(--orange-soft);color:var(--orange)}
.badge.tint{background:var(--tint-soft);color:var(--tint)}
.warn-card{background:var(--orange-soft)}
.warn-card .headline{color:var(--orange)}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat-num{font-family:var(--font-round);font-weight:700;font-size:26px;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat-lbl{font-size:13px;color:var(--label-2);line-height:1.25}
.bar{height:6px;border-radius:3px;background:var(--fill);overflow:hidden}
.bar span{display:block;height:100%;background:var(--tint);border-radius:3px}
.empty{align-items:center;text-align:center;padding:28px 20px;gap:10px}
.empty svg{width:52px;height:52px;color:var(--label-3)}

/* Text der KI */
.md{font-size:17px;line-height:1.5}
.md p{margin:0 0 10px}
.md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:0 0 10px;padding-left:22px}
.md li{margin:3px 0}
.md h4{font-size:17px;font-weight:600;margin:12px 0 6px}
.md strong{font-weight:600}
.md code{font-family:ui-monospace,Menlo,monospace;font-size:15px;background:var(--fill);padding:1px 5px;border-radius:5px}

/* Lernsession */
.overlay{position:absolute;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;animation:slideup .32s cubic-bezier(.2,.8,.2,1)}
.wo-nav{flex:none;height:52px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.wo-nav .nav-title{font-size:17px;font-weight:600;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
.wo-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:12px 16px 28px;display:flex;flex-direction:column;gap:12px}
.wo-foot{flex:none;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);display:flex;flex-direction:column;gap:8px}
.foot-note{font-size:14px;color:var(--label-2);text-align:center}
.stagebar{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 16px 8px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.stg{display:flex;flex-direction:column;gap:5px}
.stg i{height:5px;border-radius:3px;background:var(--fill-2)}
.stg span{font-size:11px;font-weight:600;color:var(--label-2);text-align:center;white-space:nowrap}
.stg.done i{background:var(--green)}
.stg.now i{background:var(--tint)}
.stg.now span{color:var(--tint)}
.q{gap:10px}
.q-num{font-size:13px;font-weight:600;text-transform:uppercase;color:var(--label-2)}
.q-text{font-size:17px;font-weight:600;line-height:1.4}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:12px;text-align:left;border:1.5px solid var(--fill-2);background:none;border-radius:12px;padding:11px 12px;font-size:16px;line-height:1.35;width:100%}
.opt:active:not(:disabled){background:var(--fill)}
.opt-mark{flex:none;width:24px;height:24px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:600;color:var(--label-2)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .opt-mark{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .opt-mark{background:var(--red);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default;color:var(--label)}
.fb{border-radius:12px;padding:11px 13px;font-size:15px;line-height:1.45}
.fb.ok{background:var(--green-soft)}
.fb.ok strong{color:var(--green)}
.fb.mid{background:var(--orange-soft)}
.fb.mid strong{color:var(--orange)}
.fb.no{background:var(--red-soft)}
.fb.no strong{color:var(--red)}
.fb.wait{background:var(--fill);color:var(--label-2);display:flex;align-items:center;gap:8px}
.fb details{margin-top:8px}
.fb summary{color:var(--tint);font-weight:600;cursor:pointer}
.fb .md{font-size:15px;margin-top:6px}
.fb ul{margin:6px 0 0;padding-left:20px}
.hint{background:var(--orange-soft);border-radius:12px;padding:10px 12px;font-size:15px}
textarea.ans{width:100%;min-height:96px;border:1.5px solid var(--fill-2);background:var(--card);border-radius:12px;padding:11px 12px;font-size:17px;line-height:1.4;resize:vertical;outline:none}
textarea.ans:focus{border-color:var(--tint)}
textarea.ans[readonly]{background:var(--fill);border-color:transparent}
.skel{display:flex;flex-direction:column;gap:10px;padding:4px 0}
.skel span{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--fill),var(--fill-2),var(--fill));background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.skel span:nth-child(2){width:86%}
.skel span:nth-child(3){width:70%}
.skel span:nth-child(4){width:92%}
.skel span:nth-child(5){width:55%}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.typing{display:inline-flex;gap:4px;padding:3px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--label-2);animation:blink 1.2s infinite both}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:.9}}
.done-badge{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;align-self:center;color:#fff;background:var(--green);margin-top:6px}
.done-badge.warn{background:var(--orange)}
.done-badge svg{width:40px;height:40px;stroke-width:3}
.done-badge span{font-family:var(--font-round);font-weight:700;font-size:24px}

/* Karteikarten */
.flash{flex:1;min-height:260px;background:var(--card);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.flash .front{font-size:21px;font-weight:600;line-height:1.35}
.flash hr{border:0;border-top:.5px solid var(--sep);margin:4px 0;width:100%}
.flash .back{font-size:17px;line-height:1.5}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end;height:90px}
.boxes div{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.boxes b{width:100%;border-radius:6px 6px 2px 2px;background:var(--tint);min-height:3px}
.boxes span{font-size:12px;color:var(--label-2)}

/* Chat zur Frage */
.msgs{display:flex;flex-direction:column;gap:6px}
.msg{max-width:84%;display:flex;flex-direction:column}
.msg.me{align-self:flex-end;align-items:flex-end}
.bubble{padding:8px 13px;border-radius:19px;font-size:16px;line-height:1.38;overflow-wrap:anywhere}
.msg.me .bubble{background:var(--tint);color:#fff}
.msg.ai .bubble{background:var(--fill);color:var(--label)}
.chat-form{display:flex;align-items:center;gap:8px;margin-top:10px}
.chat-form input{flex:1;min-width:0;height:38px;border-radius:19px;border:1px solid var(--fill-2);background:var(--card);padding:0 14px;font-size:17px;outline:none}
.chat-form input:focus{border-color:var(--tint)}
.send{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--tint);color:#fff;display:grid;place-items:center;padding:0}
.send svg{width:18px;height:18px;stroke-width:2.6}
.send:disabled{background:var(--fill-2)}

/* Sheets */
.sheet-wrap{position:absolute;inset:0;z-index:60;background:var(--scrim);display:flex;align-items:flex-end;animation:fade .2s ease}
.sheet{width:100%;max-height:calc(100% - 12px);display:flex;flex-direction:column;background:var(--bg);border-radius:12px 12px 0 0;overflow:hidden;animation:slideup .32s cubic-bezier(.2,.8,.2,1)}
.sheet:focus{outline:none}
.sheet.as{background:transparent;border-radius:0;padding:0 8px calc(8px + env(safe-area-inset-bottom));gap:8px;overflow:visible}
.sheet-nav{flex:none;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:56px;padding:0 16px;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:.5px solid var(--sep)}
.sheet-nav .nav-title{font-size:17px;font-weight:600;text-align:center;max-width:52vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:8px 16px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.sheet-body > .card, .sheet-body > .seg{margin-top:4px}
.frow{display:flex;align-items:center;gap:12px;min-height:44px;padding:4px 16px}
.flabel{flex:none;font-size:17px}
.spacer{flex:1}
.finput{flex:1;min-width:0;border:0;background:transparent;font-family:var(--font);font-size:17px;color:var(--label);text-align:right;padding:9px 0;outline:none}
.finput::placeholder,.fta::placeholder{color:var(--label-3)}
.frow:focus-within{box-shadow:inset 3px 0 0 var(--tint)}
.fta{display:block;width:100%;min-height:150px;border:0;background:transparent;font-family:var(--font);font-size:17px;line-height:1.4;color:var(--label);padding:12px 16px;resize:vertical;outline:none}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:none;border-radius:7px;padding:7px 2px;font-size:13px;font-weight:500;color:var(--label);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--seg-on);box-shadow:var(--seg-shadow);font-weight:600}
.as-group{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-radius:14px;overflow:hidden}
.as-group > *{position:relative}
.as-group > * + *::before{content:"";position:absolute;top:0;left:0;right:0;border-top:.5px solid var(--sep)}
.as-head{padding:14px 16px;text-align:center}
.as-title{font-size:13px;font-weight:600;color:var(--label-2)}
.as-text{font-size:13px;color:var(--label-2);margin-top:3px;line-height:1.35}

<script>
(function(){
'use strict';

/* ================= Helfer ================= */
const $ = (s, el) => (el || document).querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const DAY = 86400000;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const NF0 = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });
function startOfDay(d) { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; }
function dayKey(ts) { const d = new Date(ts); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function longDate(d) { return d.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' }); }
function shortDate(ts) { return new Date(ts).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' }); }
function shorten(s, n) { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
function initial(name) { return (String(name || '').trim().charAt(0) || '?').toUpperCase(); }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function inlineMd(t) { return esc(String(t || '').trim()).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\n/g, '<br>'); }
function md(src) {
  const lines = String(src || '').replace(/\r/g, '').split('\n');
  let html = '', list = null, para = [];
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const flushP = () => { if (para.length) { html += `<p>${para.map(inl).join('<br>')}</p>`; para = []; } };
  const flushL = () => { if (list) { html += `<${list.t}>${list.items.map(i => `<li>${inl(i)}</li>`).join('')}</${list.t}>`; list = null; } };
  lines.forEach(raw => {
    const l = raw.replace(/\s+$/, ''); let m;
    if (!l.trim()) { flushP(); flushL(); return; }
    if ((m = l.match(/^#{1,4}\s+(.*)$/))) { flushP(); flushL(); html += `<h4>${inl(m[1])}</h4>`; return; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); return; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', items: [] }; } list.items.push(m[1]); return; }
    flushL(); para.push(l.trim());
  });
  flushP(); flushL();
  return html;
}
let toastTimer = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400); }
const ICON = {
  chev: '<svg class="i chev" viewBox="0 0 8 14" aria-hidden="true"><path d="M1.5 1.5 6.5 7l-5 5.5" stroke-width="2"/></svg>',
  back: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" stroke-width="2.4"/></svg>',
  check: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5 10 17.5 19.5 7"/></svg>',
  plus: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor" stroke="none"/><path d="M12 7.5v9M7.5 12h9" stroke="#fff" stroke-width="2.2"/></svg>',
  plusNav: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke-width="2.4"/></svg>',
  up: '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
  book: '<svg class="i" viewBox="0 0 52 52" aria-hidden="true"><path d="M6 13c6.7-3.3 13.3-3.3 20 0v29c-6.7-3.3-13.3-3.3-20 0z"/><path d="M46 13c-6.7-3.3-13.3-3.3-20 0v29c6.7-3.3 13.3-3.3 20 0z"/></svg>',
  cards: '<svg class="i" viewBox="0 0 52 52" aria-hidden="true"><rect x="8" y="15" width="30" height="28" rx="5"/><path d="M15 9h24a5 5 0 0 1 5 5v22"/></svg>'
};
const TYPING = '<span class="typing" role="img" aria-label="Lädt"><i></i><i></i><i></i></span>';
const SKEL = '<div class="skel" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>';

/* ================= Speicher ================= */
const KEY = 'lernen-v1';
function freshState() {
  return { v: 1, profile: { name: '', program: '', style: 'einfach', quality: 'schnell', onboarded: false }, subjects: [], topics: {}, cards: [], stats: { answers: [], mistakes: [], days: [] }, last: null };
}
function valid(s) { return !!(s && s.v === 1 && s.profile && Array.isArray(s.subjects) && s.topics && Array.isArray(s.cards) && s.stats); }
let state = (() => { try { const raw = localStorage.getItem(KEY); const s = raw ? JSON.parse(raw) : null; return valid(s) ? s : freshState(); } catch (e) { return freshState(); } })();
state.stats.answers = state.stats.answers || []; state.stats.mistakes = state.stats.mistakes || []; state.stats.days = state.stats.days || [];
let saveWarned = false;
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { if (!saveWarned) { saveWarned = true; toast('Speicher ist voll. Mach ein Backup und lösch alte Fächer.'); } } }
let saveTimer = null;
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(save, 600); }

/* Unterlagen-Texte liegen in IndexedDB, weil sie groß werden können */
const IDB = (() => {
  let dbp = null; const mem = new Map();
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      try { const r = indexedDB.open('lernen', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
      catch (e) { rej(e); }
    });
    return dbp;
  }
  function tx(mode, fn) { return open().then(db => new Promise((res, rej) => { const st = db.transaction('kv', mode).objectStore('kv'); const r = fn(st); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); })); }
  return {
    get: k => tx('readonly', st => st.get(k)).catch(() => mem.get(k)),
    set: (k, v) => tx('readwrite', st => st.put(v, k)).catch(() => { mem.set(k, v); }),
    del: k => tx('readwrite', st => st.delete(k)).catch(() => { mem.delete(k); }),
    keys: () => tx('readonly', st => st.getAllKeys()).catch(() => Array.from(mem.keys()))
  };
})();

/* ================= Daten-Helfer ================= */
const STAGES = { 1: 'Einfach', 2: 'Genauer', 3: 'Anwenden', 4: 'Eigene Worte' };
const PASS = { 1: 0.5, 2: 0.6, 3: 0.6, 4: 0.6 };
function subjectById(id) { return state.subjects.find(s => s.id === id) || null; }
function topicsOf(sid) { const s = subjectById(sid); return s ? s.topics.map(id => state.topics[id]).filter(Boolean) : []; }
function dueCards(sid) { const now = Date.now(); return state.cards.filter(c => c.due <= now && (!sid || c.subjectId === sid)); }
function learnedCount(sid) { return topicsOf(sid).filter(t => t.status === 'gelernt').length; }
function markActive() { const k = dayKey(Date.now()); if (state.stats.days.indexOf(k) < 0) { state.stats.days.push(k); if (state.stats.days.length > 120) state.stats.days = state.stats.days.slice(-120); } }
function streak() {
  const set = new Set(state.stats.days); let n = 0; let d = startOfDay(new Date());
  if (!set.has(dayKey(d))) d = new Date(d.getTime() - DAY);
  while (set.has(dayKey(d))) { n++; d = new Date(d.getTime() - DAY); }
  return n;
}
function accuracy(sid) { const a = state.stats.answers.filter(x => !sid || x.s === sid).slice(-60); return { n: a.length, rate: a.length ? a.reduce((s, x) => s + x.c, 0) / a.length : 0 }; }
function topicStatus(t) {
  if (t.session && t.session.stage <= 4) return { text: `Stufe ${t.session.stage} von 4 · ${STAGES[t.session.stage]}`, cls: 'go', badge: 'tint' };
  if (t.session && t.session.stage === 5) return { text: 'Wird abgeschlossen', cls: 'go', badge: 'tint' };
  if (t.status === 'gelernt') return { text: `Gelernt · ${t.mastery} %`, cls: 'ok', badge: 'green' };
  if (t.status === 'unsicher') return { text: `Noch unsicher · ${t.mastery} %`, cls: 'warn', badge: 'orange' };
  return { text: 'Neu', cls: '', badge: '' };
}
function nextTopic(sid) { const ts = topicsOf(sid); return ts.find(t => t.session) || ts.find(t => t.status === 'neu') || ts.find(t => t.status === 'unsicher') || null; }
function recordAnswer(t, correct, q, sol) {
  const st = state.stats;
  st.answers.push({ ts: Date.now(), s: t.subjectId, c: correct ? 1 : 0 });
  if (st.answers.length > 400) st.answers = st.answers.slice(-400);
  markActive();
  if (!correct) {
    st.mistakes.push({ ts: Date.now(), subjectId: t.subjectId, topicId: t.id, q: shorten(q, 160) });
    if (st.mistakes.length > 40) st.mistakes = st.mistakes.slice(-40);
    const s = t.session;
    if (s && s.mistakeCards.length < 6 && !s.mistakeCards.some(c => c.front === q)) s.mistakeCards.push({ front: shorten(q, 300), back: shorten(sol || '', 500) });
  }
}

/* ================= KI ================= */
function getKey() { try { return localStorage.getItem('lernen-apikey') || localStorage.getItem('kevin-training-apikey') || ''; } catch (e) { return ''; } }
function setKey(v) { try { if (v) localStorage.setItem('lernen-apikey', v); else localStorage.removeItem('lernen-apikey'); } catch (e) { /* egal */ } }
function model() { return state.profile.quality === 'gruendlich' ? 'claude-sonnet-5-5' : 'claude-haiku-5-5'; }
async function callAI(content, opts) {
  opts = opts || {};
  const key = getKey(); if (!key) throw { code: 'nokey' };
  const body = { model: model(), max_tokens: opts.maxTokens || 2000, messages: [{ role: 'user', content }] };
  if (opts.system) body.system = opts.system;
  let res;
  try { res = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' }, body: JSON.stringify(body) }); }
  catch (e) { throw { code: 'network' }; }
  if (!res.ok) {
    let msg = ''; try { const j = await res.json(); msg = (j && j.error && j.error.message) || ''; } catch (e) { /* egal */ }
    throw { code: res.status === 401 || res.status === 403 ? 'bad_key' : res.status === 429 ? 'rate' : res.status >= 500 ? 'overloaded' : /credit|balance/i.test(msg) ? 'credit' : 'bad_request', msg };
  }
  const j = await res.json();
  return (j.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
}
function parseJSON(t) {
  t = String(t || '').trim().replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/, '');
  try { return JSON.parse(t); } catch (e) { /* weiter */ }
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) { /* weiter */ } }
  return null;
}
async function callJSON(content, opts) { const o = parseJSON(await callAI(content, opts)); if (!o || typeof o !== 'object') throw { code: 'bad_json' }; return o; }
function aiErrorText(e) {
  switch (e && e.code) {
    case 'nokey': return 'Kein KI-Schlüssel hinterlegt. Tipp auf Heute oben rechts auf deinen Buchstaben und trag ihn ein.';
    case 'bad_key': return 'Der KI-Schlüssel stimmt nicht. Prüf ihn in den Einstellungen.';
    case 'credit': return 'Dein KI-Guthaben ist aufgebraucht. Lad in der Anthropic Console etwas nach.';
    case 'rate': return 'Gerade zu viele Anfragen. Warte kurz und versuch es nochmal.';
    case 'overloaded': return 'Die KI ist gerade überlastet. Versuch es gleich nochmal.';
    case 'network': return 'Keine Internetverbindung. Prüf dein Netz und versuch es nochmal.';
    case 'bad_json': return 'Die Antwort der KI war unvollständig. Versuch es nochmal.';
    default: return 'Das hat nicht geklappt. Versuch es nochmal.';
  }
}
const SYSTEM = `Du bist ein geduldiger, direkter Tutor in einer Lern-App für Studierende. Du schreibst auf Deutsch, in Du-Form, klar und ohne Floskeln.
Regeln:
- Erst das Wesentliche, dann Details. Keine langen Einleitungen, kein „Gute Frage“.
- Konkrete, alltagsnahe Beispiele mit Zahlen, wenn es passt.
- Formeln als gut lesbarer Text mit Unicode (z. B. x̄ = (x₁ + x₂ + … + xₙ) / n, σ², √, ≤, ≥, ×, ·). Kein LaTeX, kein * für Multiplikation.
- Formatierung nur mit **fett**, Spiegelstrichen „- “ und nummerierten Listen. Keine Tabellen, keine Überschriften mit #.
- Halte dich an die Unterlagen des Studenten, wenn welche da sind. Erfinde keine Fakten; fehlt etwas, nutze anerkanntes Lehrbuchwissen.
- Wenn JSON verlangt ist, antworte ausschließlich mit gültigem JSON ohne weiteren Text.`;
function learnerProfile(sid) {
  const p = state.profile, acc = accuracy(sid);
  const level = acc.n < 6 ? 'noch keine Einschätzung' : acc.rate < 0.55 ? 'tut sich noch schwer: sehr einfach erklären, kleine Schritte, viele Beispiele' : acc.rate < 0.8 ? 'solides Grundverständnis' : 'kommt schnell voran: darf anspruchsvoller sein, weniger Wiederholung';
  const styles = { einfach: 'mit leichten, einfachen Alltagsbeispielen', kurz: 'kurz und knapp, auf den Punkt', ausfuehrlich: 'ausführlich mit Hintergründen und Zusammenhängen' };
  const mistakes = state.stats.mistakes.filter(m => !sid || m.subjectId === sid).slice(-5).map(m => `- ${m.q}`).join('\n');
  return `LERNENDER
Name: ${p.name || 'unbekannt'}${p.program ? ` · Studium: ${p.program}` : ''}
Lernstil: erklärt bekommen ${styles[p.style] || styles.einfach}
Trefferquote${sid ? ' in diesem Fach' : ''}: ${acc.n ? Math.round(acc.rate * 100) + ' % bei ' + acc.n + ' Antworten' : 'noch keine Daten'} → ${level}${mistakes ? '\nZuletzt falsch beantwortet:\n' + mistakes : ''}`;
}
function retrieve(text, terms, limit) {
  if (!text) return '';
  const chunks = [];
  text.split(/\n\s*\n/).forEach(c => { c = c.trim(); if (c.length < 30) return; if (c.length <= 900) chunks.push(c); else for (let i = 0; i < c.length; i += 850) chunks.push(c.slice(i, i + 900)); });
  const words = Array.from(new Set(terms.join(' ').toLowerCase().split(/[^a-zäöüß0-9]+/i).filter(w => w.length > 3)));
  if (!words.length) return '';
  const scored = chunks.map((c, i) => { const lc = c.toLowerCase(); let s = 0; words.forEach(w => { if (lc.indexOf(w) >= 0) s++; }); return { c, i, s }; }).filter(x => x.s > 0).sort((a, b) => b.s - a.s);
  const out = []; let len = 0;
  for (const x of scored) { if (len + x.c.length > limit) continue; out.push(x); len += x.c.length; if (len > limit * 0.9) break; }
  return out.sort((a, b) => a.i - b.i).map(x => x.c).join('\n---\n');
}
async function materialText(sid) {
  const s = subjectById(sid); if (!s || !s.materials.length) return '';
  const texts = await Promise.all(s.materials.map(m => IDB.get('mat:' + m.id).then(t => t || '').catch(() => '')));
  return texts.join('\n\n');
}
async function topicContext(t) {
  const subj = subjectById(t.subjectId);
  const all = await materialText(t.subjectId);
  const snippets = retrieve(all, [t.title].concat(t.keywords || []), 6000);
  return `FACH: ${subj ? subj.name : ''}
THEMA: ${t.title}${t.goal ? '\nLERNZIEL: ' + t.goal : ''}${t.notes ? '\nKERNINHALTE AUS DEN UNTERLAGEN:\n' + t.notes : ''}${snippets ? '\nPASSENDE STELLEN AUS DEN UNTERLAGEN:\n' + snippets : ''}${!t.notes && !snippets ? '\n(Keine Unterlagen zu diesem Thema – nutze anerkanntes Lehrbuchwissen auf Hochschulniveau.)' : ''}`;
}

/* ================= Lernsession: Inhalte erzeugen ================= */
function newSession() { return { stage: 1, content: {}, answers: { 1: {}, 2: {}, 3: {}, 4: '' }, results: { 1: {}, 2: {}, 3: {}, 4: null }, notes: {}, hints: {}, scores: {}, round3: 1, skipped: false, mistakeCards: [], qa: [], err: null, finish: null }; }
function itemsOf(s, st) { const c = s.content[st]; return !c ? [] : st === 3 ? c.tasks : c.check; }
function stageScore(s, st) {
  const items = itemsOf(s, st); if (!items.length) return null;
  let sum = 0;
  for (let i = 0; i < items.length; i++) { const r = s.results[st][i]; if (!r || r.score == null) return null; sum += r.score; }
  return sum / items.length;
}
function normalizeStage(o, st) {
  if (st === 3) {
    const tasks = (Array.isArray(o.tasks) ? o.tasks : []).filter(x => x && x.q).slice(0, 4).map(x => ({ type: 'open', q: String(x.q), hint: String(x.hint || ''), solution: String(x.solution || '') }));
    if (!tasks.length) throw { code: 'bad_json' };
    return { tasks };
  }
  const explanation = String(o.explanation || '').trim();
  const check = (Array.isArray(o.check) ? o.check : []).filter(x => x && x.q).slice(0, 4).map(x => {
    const opts = Array.isArray(x.options) ? x.options.map(v => String(v)).filter(Boolean).slice(0, 5) : [];
    if (x.type === 'open' || opts.length < 2) return { type: 'open', q: String(x.q), solution: String(x.solution || x.why || '') };
    let a = parseInt(x.answer, 10); if (!(a >= 0 && a < opts.length)) a = 0;
    const order = shuffle(opts.map((_, i) => i));
    return { type: 'mc', q: String(x.q), options: order.map(i => opts[i]), answer: order.indexOf(a), why: String(x.why || '') };
  });
  if (!explanation || !check.length) throw { code: 'bad_json' };
  return { explanation, check };
}
async function genStage(t, st) {
  const s = t.session, prog = state.profile.program ? ` – gern passend zu seinem Studium (${state.profile.program})` : '';
  const head = `${learnerProfile(t.subjectId)}\n\n${await topicContext(t)}\n\n`;
  let task;
  if (st === 1) task = `AUFGABE: Stufe 1 von 4 – „Einfach erklärt“.
Erkläre das Thema so, dass es jemand ohne Vorwissen sofort versteht: 90–160 Wörter, mit einem konkreten Alltagsbeispiel${prog}. Fachbegriffe nur mit Erklärung.
Danach 2 kurze Verständnisfragen als Multiple Choice mit je 3 oder 4 Antworten, genau eine richtig, die falschen plausibel.
${s.notes[1] || ''}
Antworte nur mit JSON in dieser Form („answer“ = Index der richtigen Antwort, beginnend bei 0):
{"explanation":"...","check":[{"type":"mc","q":"...","options":["...","...","..."],"answer":0,"why":"1 Satz, warum"}]}`;
  else if (st === 2) task = `AUFGABE: Stufe 2 von 4 – „Genauer“. Die einfache Erklärung hatte er schon.
Erkläre das Thema jetzt genauer, wie in einer guten Vorlesung, aber verständlich: 180–320 Wörter. Mit den wichtigen Fachbegriffen (fett), ggf. Formeln und einem Beispiel, das Schritt für Schritt durchgerechnet oder durchgespielt wird.
Danach 3 Fragen: 2× Multiple Choice und 1 offene Frage, die man in 1–3 Sätzen oder mit einer kurzen Rechnung beantwortet.
${s.notes[2] || ''}

let pdfjsP = null;
function loadPdfJs() {
  if (!pdfjsP) pdfjsP = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = () => { try { window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(window.pdfjsLib); } catch (e) { rej(e); } };
    s.onerror = () => { pdfjsP = null; rej(new Error('pdfjs')); };
    document.head.appendChild(s);
  });
  return pdfjsP;
}
async function pdfToText(file, onProgress) {
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let i = 1; i <= doc.numPages; i++) {
    const tc = await (await doc.getPage(i)).getTextContent();
    let txt = '', line = '', lastY = null;
    tc.items.forEach(it => { const y = it.transform ? it.transform[5] : null; if (lastY !== null && y !== null && Math.abs(y - lastY) > 2) { txt += line.trim() + '\n'; line = ''; } line += it.str + ' '; lastY = y; });
    txt += line.trim();
    pages.push(`[Seite ${i}]\n` + txt.replace(/[ \t]+/g, ' ').trim());
    if (onProgress) onProgress(i, doc.numPages);
  }
  return { text: pages.join('\n\n'), pages: doc.numPages };
}
function imageToBase64(file, max) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { const k = Math.min(1, (max || 1600) / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.85).split(',')[1]); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}

let lastFocus = null;

  const w = $('#sheetWrap'), s = $('#sheet');

  s.innerHTML = html; w.hidden = false;

}
function closeSheet() {
  const w = $('#sheetWrap'); if (w.hidden) return;
  w.hidden = true; $('#sheet').innerHTML = '';

}

/* ================= Aktionen ================= */
async function exportBackup() {
  const mats = {};
  for (const s of state.subjects) for (const m of s.materials) { mats[m.id] = await IDB.get('mat:' + m.id) || ''; }
  const blob = new Blob([JSON.stringify({ app: 'lernen', v: 1, state, materials: mats })], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'lernen-backup-' + dayKey(Date.now()) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
function importBackup(file) {
  const r = new FileReader();
  r.onload = async () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || o.app !== 'lernen' || !valid(o.state)) throw new Error('ungültig');
      for (const id of Object.keys(o.materials || {})) await IDB.set('mat:' + id, o.materials[id]);
      state = o.state; save(); closeSheet(); ui.tab = 'today'; ui.subjectId = null; render(); toast('Backup geladen');
    } catch (e) { toast('Das ist keine gültige Backup-Datei.'); }
  };
  r.readAsText(file);
}
async function deleteSubject(id) {
  const s = subjectById(id); if (!s) return;
  for (const m of s.materials) await IDB.del('mat:' + m.id);
  s.topics.forEach(tid => { delete state.topics[tid]; });
  state.cards = state.cards.filter(c => c.subjectId !== id);
  state.subjects = state.subjects.filter(x => x.id !== id);
  if (state.last && !state.topics[state.last.topicId]) state.last = null;
  save(); closeSheet(); ui.subjectId = null; render(); toast('Fach gelöscht');
}
function shareSheet(t, mode) {
  const text = `${t.title}\n\n${t.sheet}`;
  if (mode === 'share' && navigator.share) { navigator.share({ title: t.title, text }).catch(() => {}); return; }
  if (navigator.clipboard) navigator.clipboard.writeText(text).then(() => toast('Lernzettel kopiert'), () => toast('Kopieren hat nicht geklappt'));
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-tab]');
  if (!t || t.disabled) return;
  if (t.dataset.tab) { closeSheet(); if (ui.tab === t.dataset.tab && t.dataset.tab === 'subjects') ui.subjectId = null; ui.tab = t.dataset.tab; render(); return; }
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case 'settings': openSettings(); break;
    case 'seg': if (draft) { draft[t.dataset.name] = t.dataset.val; t.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b === t))); } break;
    case 'settings-save': saveSettings(); break;
    case 'export': exportBackup(); break;
    case 'import': { const f = $('#importFile'); if (f) f.click(); break; }
    case 'wipe': confirmSheet({ title: 'Wirklich alles löschen?', text: 'Fächer, Unterlagen, Themen, Karten und Statistik werden gelöscht. Mach vorher ein Backup.', confirm: 'Alles löschen', act: 'wipe-yes' }); break;
    case 'wipe-yes': (async () => { const keys = await IDB.keys(); for (const k of keys) await IDB.del(k); const prof = state.profile; state = freshState(); state.profile = prof; save(); closeSheet(); ui.tab = 'today'; ui.subjectId = null; render(); toast('Alles gelöscht'); })(); break;
    case 'add-subject': openNameSheet({ title: 'Neues Fach', label: 'Name', placeholder: 'z. B. Statistik', act: 'add-subject-save', foot: 'Danach lädst du die Unterlagen für dieses Fach hoch.' }); break;
    case 'add-subject-save': { const n = ($('#nameInput').value || '').trim(); if (!n) { toast('Gib dem Fach einen Namen.'); break; } const s = { id: uid(), name: n.slice(0, 60), created: Date.now(), materials: [], topics: [] }; state.subjects.push(s); save(); closeSheet(); ui.tab = 'subjects'; ui.subjectId = s.id; render(); break; }
    case 'open-subject': ui.tab = 'subjects'; ui.subjectId = id; render(); break;
    case 'back-subjects': ui.subjectId = null; render(); break;
    case 'rename-subject': { const s = subjectById(id); if (s) openNameSheet({ title: 'Fach umbenennen', label: 'Name', value: s.name, act: 'rename-subject-save', id }); break; }
    case 'rename-subject-save': { const s = subjectById(id), n = ($('#nameInput').value || '').trim(); if (s && n) { s.name = n.slice(0, 60); save(); } closeSheet(); render(true); break; }
    case 'del-subject': confirmSheet({ title: 'Fach löschen?', text: 'Alle Themen, Unterlagen und Karteikarten dieses Fachs werden gelöscht.', confirm: 'Fach löschen', act: 'del-subject-yes', id }); break;
    case 'del-subject-yes': deleteSubject(id); break;
    case 'add-material': openAddMaterial(id); break;
    case 'mat-pick': { const f = $(t.dataset.kind === 'pdf' ? '#matPdf' : '#matFoto'); if (f) f.click(); break; }
    case 'mat-text': if (matCtx) { matCtx.mode = 'text'; renderMatSheet(); } break;
    case 'mat-save-text': (async () => {
      const txt = ($('#matText').value || '').trim(), name = ($('#matName').value || '').trim() || `Text vom ${shortDate(Date.now())}`;
      if (txt.length < 80) { toast('Füg etwas mehr Text ein.'); return; }
      const m = matCtx; const mat = await addMaterial(m.sid, name, 'text', txt, 0);
      try { await generateTopics(m.sid, mat); } catch (err) { m.mode = 'work'; m.error = aiErrorText(err); renderMatSheet(); render(true); }
    })(); break;
    case 'material': openMaterial(t.dataset.sid, id); break;
    case 'gen-one': (async () => { const s = subjectById(t.dataset.sid), m = s && s.materials.find(x => x.id === id); if (!m) return; matCtx = { sid: s.id, mode: 'work' }; try { await generateTopics(s.id, m); } catch (err) { matCtx.error = aiErrorText(err); renderMatSheet(); } })(); break;
    case 'gen-all': (async () => {
      const s = subjectById(id); if (!s) return;
      const list = s.materials.filter(m => !m.processed); let total = 0;
      matCtx = { sid: s.id, mode: 'work', title: 'KI erstellt deine Lernthemen …' };
      try { for (let i = 0; i < list.length; i++) { matCtx.info = `${list[i].name} (${i + 1} von ${list.length})`; renderMatSheet(); total += await generateTopics(s.id, list[i], true) || 0; } closeSheet(); matCtx = null; render(true); toast(`${total} neue Themen erstellt`); }
      catch (err) { matCtx.error = aiErrorText(err); renderMatSheet(); render(true); }
    })(); break;
    case 'del-material': confirmSheet({ title: 'Unterlage löschen?', text: 'Die Themen daraus bleiben erhalten.', confirm: 'Löschen', act: 'del-material-yes', id: t.dataset.sid + '|' + id }); break;
    case 'del-material-yes': { const parts = String(id).split('|'), s = subjectById(parts[0]); if (s) { s.materials = s.materials.filter(m => m.id !== parts[1]); IDB.del('mat:' + parts[1]); save(); } closeSheet(); render(true); break; }
    case 'add-topic': openNameSheet({ title: 'Neues Thema', label: 'Thema', placeholder: 'z. B. Standardabweichung', act: 'add-topic-save', id, notes: 'Optional: Was gehört dazu? Stichpunkte aus der Vorlesung …', foot: 'Ohne Unterlagen erklärt die KI das Thema mit Lehrbuchwissen.' }); break;
    case 'add-topic-save': { const s = subjectById(id), n = ($('#nameInput').value || '').trim(); if (!s || !n) { toast('Gib dem Thema einen Namen.'); break; } const notesEl = $('#notesInput'); const tp = { id: uid(), subjectId: s.id, title: n.slice(0, 70), goal: '', keywords: n.split(/\s+/).slice(0, 5), notes: notesEl ? notesEl.value.trim().slice(0, 1600) : '', status: 'neu', mastery: 0, session: null, sheet: '', created: Date.now(), source: null }; state.topics[tp.id] = tp; s.topics.push(tp.id); save(); closeSheet(); render(true); break; }
    case 'topic': openTopic(id); break;
    case 'rename-topic': { const tp = state.topics[id]; if (tp) openNameSheet({ title: 'Thema umbenennen', label: 'Thema', value: tp.title, act: 'rename-topic-save', id }); break; }
    case 'rename-topic-save': { const tp = state.topics[id], n = ($('#nameInput').value || '').trim(); if (tp && n) { tp.title = n.slice(0, 70); save(); } closeSheet(); render(true); break; }
    case 'del-topic': confirmSheet({ title: 'Thema löschen?', text: 'Auch die Karteikarten dazu werden gelöscht.', confirm: 'Thema löschen', act: 'del-topic-yes', id }); break;
    case 'del-topic-yes': { const tp = state.topics[id]; if (tp) { const s = subjectById(tp.subjectId); if (s) s.topics = s.topics.filter(x => x !== id); delete state.topics[id]; state.cards = state.cards.filter(c => c.topicId !== id); if (state.last && state.last.topicId === id) state.last = null; save(); } closeSheet(); render(true); break; }
    case 'restart': openSession(id, true); break;
    case 'sheet-view': openSheetView(id); break;
    case 'copy-sheet': { const tp = state.topics[id]; if (tp) shareSheet(tp, 'copy'); break; }
    case 'share-sheet': { const tp = state.topics[id]; if (tp) shareSheet(tp, 'share'); break; }
    case 'learn': { const tp = state.topics[id]; if (!tp) break; if (!getKey()) { openSettings(); toast('Trag zuerst deinen KI-Schlüssel ein.'); break; } openSession(id, !tp.session && tp.status !== 'neu'); break; }
    case 'sess-close': closeSession(); break;
    case 'sess-retry': { const tp = sessTopic(); if (tp) { tp.session.err = null; renderSession(); ensureStage(tp, tp.session.stage); } break; }
    case 'ask': openAsk(); break;
    case 'mc': answerMC(+t.dataset.q, +t.dataset.o); break;
    case 'grade': gradeOpen(+t.dataset.q); break;
    case 'hint': { const tp = sessTopic(); if (tp) { tp.session.hints[tp.session.stage + ':' + t.dataset.q] = true; save(); renderSession(true); } break; }
    case 'next': nextStage(false); break;
    case 'skip': nextStage(true); break;
    case 'redo': redoStage(); break;
    case 'grade-sum': gradeSummary(); break;
    case 'sum-again': { const tp = sessTopic(); if (tp) { tp.session.results[4] = null; save(); renderSession(true); const ta = $('#ans-4-0'); if (ta) ta.focus(); } break; }
    case 'finish-retry': { const tp = sessTopic(); if (tp) runFinish(tp); break; }
    case 'finish-skip': { const tp = sessTopic(); if (tp) { finishTopic(tp, '', []); save(); renderSession(); } break; }
    case 'finish-done': { const tp = sessTopic(); if (tp) { tp.session = null; state.last = { topicId: tp.id, ts: Date.now() }; save(); } closeSession(); break; }
    case 'review': startReview(null); break;
    case 'review-subject': startReview(id); break;
    case 'rv-reveal': if (review) { review.revealed = true; renderReview(); } break;
    case 'rv-known': if (review) rateCard(true); break;
    case 'rv-again': if (review) rateCard(false); break;
    case 'review-done': review = null; $('#overlay').hidden = true; $('#overlay').innerHTML = ''; render(true); break;
    case 'exam': { if (!getKey()) { openSettings(); toast('Trag zuerst deinen KI-Schlüssel ein.'); break; } startExam(id); break; }
    case 'exam-retry': if (exam) startExam(exam.sid); break;
    case 'exam-submit': submitExam(); break;
    case 'exam-close': if (exam && exam.status === 'answer' && exam.tasks.some((_, i) => String(exam.answers[i] || '').trim())) { confirmSheet({ title: 'Probeklausur abbrechen?', text: 'Deine Antworten gehen verloren.', confirm: 'Abbrechen', act: 'exam-close-yes' }); break; } exam = null; $('#overlay').hidden = true; $('#overlay').innerHTML = ''; render(true); break;
    case 'exam-close-yes': closeSheet(); exam = null; $('#overlay').hidden = true; $('#overlay').innerHTML = ''; render(true); break;
    case 'sheet-close': closeSheet(); if (matCtx && matCtx.mode !== 'work') matCtx = null; break;
  }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset && el.dataset.st) { const tp = sessTopic(); if (!tp) return; const st = +el.dataset.st; if (st === 4) tp.session.answers[4] = el.value; else tp.session.answers[st][+el.dataset.q] = el.value; saveSoon(); }
  else if (el.dataset && el.dataset.ex != null && exam) { exam.answers[+el.dataset.ex] = el.value; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.id === 'matPdf' && el.files && el.files[0]) processPdf(el.files[0]);
  else if (el.id === 'matFoto' && el.files && el.files.length) processFotos(Array.from(el.files).slice(0, 12));
  else if (el.id === 'importFile' && el.files && el.files[0]) importBackup(el.files[0]);
});
document.addEventListener('submit', e => {
  if (e.target.id === 'askForm') { e.preventDefault(); const i = $('#askInput'); const v = i.value; i.value = ''; sendAsk(v); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('#sheetWrap').hidden) closeSheet();
  if (e.key === 'Enter' && e.target && e.target.id === 'nameInput') { e.preventDefault(); const b = $('.sheet-nav .nav-btn.strong'); if (b) b.click(); }
});
$('#sheetWrap').addEventListener('click', e => { if (e.target.id === 'sheetWrap' && !(matCtx && matCtx.mode === 'work' && !matCtx.error)) closeSheet(); });
$('#main').addEventListener('scroll', onScroll, { passive: true });
window.addEventListener('pagehide', save);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') save(); });

render();
if (!state.profile.onboarded) setTimeout(openSettings, 300);
if ('serviceWorker' in navigator && location.protocol === 'https:') window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
})();
</script>
</body>
</html>
